syntax = "proto3";

package prices;

message Empty {}

message StockPrice {
  int64 id = 1;
  string symbol = 2;
  string price = 3;
  string updated_at = 4;
}

message ListPricesResponse {
  repeated StockPrice prices = 1;
}

message GetPriceRequest {
  string symbol = 1;
}

message PriceResponse {
  StockPrice price = 1;
}

message FluctuatePricesResponse {
  int32 updated_count = 1;
}

service PricesService {
  rpc ListPrices (Empty) returns (ListPricesResponse);
  rpc GetPrice (GetPriceRequest) returns (PriceResponse);
  rpc FluctuatePrices (Empty) returns (FluctuatePricesResponse);
}
