services:
  consul:
    image: hashicorp/consul:1.19.2
    container_name: consul
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  exchanges_service:
    build: ./services/exchanges_service
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: exchanges_db
      DB_PORT: 5432
      PORT: 4001
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: exchanges_service
      SERVICE_ADDRESS: exchanges_service
      SERVICE_TAGS: backend,stocks,exchanges
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  prices_service:
    build: ./services/prices_service
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: prices_db
      DB_PORT: 5432
      PORT: 4002
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: prices_service
      SERVICE_ADDRESS: prices_service
      SERVICE_TAGS: backend,stocks,prices
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  operations_service:
    build: ./services/operations_service
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: operations_db
      DB_PORT: 5432
      PORT: 4003
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      SERVICE_NAME: operations_service
      SERVICE_ADDRESS: operations_service
      SERVICE_TAGS: backend,stocks,operations
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy

  middleware1:
    build: ./middleware
    environment:
      PORT: 4000
      SERVICES_FILE: /app/services.json
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      consul:
        condition: service_healthy
      exchanges_service:
        condition: service_started
      prices_service:
        condition: service_started
      operations_service:
        condition: service_started

  middleware2:
    build: ./middleware
    environment:
      PORT: 4000
      SERVICES_FILE: /app/services.json
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      consul:
        condition: service_healthy
      exchanges_service:
        condition: service_started
      prices_service:
        condition: service_started
      operations_service:
        condition: service_started

  loadbalancer:
    build: ./loadbalancer
    ports:
      - "8080:8080"
    depends_on:
      - middleware1
      - middleware2

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - loadbalancer

volumes:
  postgres_data:
